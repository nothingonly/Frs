name: Flutter dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: write

concurrency:
  group: flutter-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Commit lockfile changes if required
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already matches pubspec.yaml and the selected Flutter SDK."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: refresh Flutter dependency lockfile"
          git push
