name: FRS backend checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "implementation/**", "sprint/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - name: Install backend and test dependencies from lockfile
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.lock ]; then
            python -m pip install -r requirements.lock
            python -m pip install -e . --no-deps
          else
            python -m pip install -e ".[dev]"
          fi
          python -m pip install pip-audit
      - name: Compile Python packages
        run: python -m compileall -q app tests
      - name: Lint backend
        run: ruff check app tests
      - name: Run backend unit tests
        run: pytest
      - name: Audit backend dependencies
        # PYSEC-2026-1845 is a /tmp directory advisory for the pytest test runner (development tool only, not bundled in production)
        run: pip-audit --desc --ignore-vuln PYSEC-2026-1845
