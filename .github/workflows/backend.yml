name: FRS backend checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "implementation/**", "sprint/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies from current project constraints
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
      - name: Compile Python packages
        run: python -m compileall -q app tests
      - name: Lint backend
        run: ruff check app tests
      - name: Run backend unit tests
        run: pytest
      - name: Audit installed backend dependencies
        run: pip-audit --desc

  postgres-migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frs
          POSTGRES_PASSWORD: frs-ci-password
          POSTGRES_DB: frs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frs -d frs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      FRS_ENV: development
      FRS_DATABASE_URL: postgresql+psycopg://frs:frs-ci-password@localhost:5432/frs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Apply all PostgreSQL migrations
        run: python -m app.db.migrator --apply
      - name: Verify PostgreSQL migration state, RLS and append-only audit behavior
        run: pytest tests/test_postgres_migrations_integration.py -v

  backend-container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build backend image
        run: docker build --pull --tag frs-backend-ci:pr ./backend
