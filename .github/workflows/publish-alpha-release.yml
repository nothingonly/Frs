name: Publish FRS alpha prerelease

# The first committed version of this workflow intentionally triggers the alpha release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.2.0-beta.1)"
        required: true
        default: "v0.2.0-beta.1"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Lint Python
        run: ruff check app tests
      - name: Run backend tests
        run: pytest -q

  android-debug-build:
    name: Flutter quality gate and Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --fatal-infos
      - name: Run Flutter tests
        run: flutter test --reporter expanded
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload APK for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frs-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: [backend-quality, android-debug-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download tested Android APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frs-android-debug
          path: artifacts
      - name: Update repository About metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FRS_RELEASE_TOKEN || github.token }}
        run: |
          gh repo edit "${{ github.repository }}" \
            --description "Face Recognition Attendance System (FRS) — Flutter Android kiosk and FastAPI backend for secure, multi-frame biometric attendance verification and identification." \
            --add-topic face-recognition \
            --add-topic attendance-system \
            --add-topic flutter \
            --add-topic fastapi \
            --add-topic python \
            --add-topic computer-vision \
            --add-topic arcface \
            --add-topic biometrics \
            --add-topic android-kiosk \
            --add-topic onnx

      - name: Create prerelease if not already published
        env:
          GH_TOKEN: ${{ secrets.FRS_RELEASE_TOKEN || github.token }}
          VERSION: ${{ github.event.inputs.version || 'v0.2.0-beta.1' }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving the published release unchanged."
            exit 0
          fi
          NOTES_FILE=""
          if [ -f "releases/${VERSION}.md" ]; then
            NOTES_FILE="releases/${VERSION}.md"
          elif [ -f "RELEASE_NOTES.md" ]; then
            NOTES_FILE="RELEASE_NOTES.md"
          fi
          
          if [ -n "$NOTES_FILE" ]; then
            gh release create "$VERSION" artifacts/app-debug.apk \
              --title "FRS Release $VERSION" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --target main
          else
            gh release create "$VERSION" artifacts/app-debug.apk \
              --title "FRS Release $VERSION" \
              --notes "Automated build release for FRS $VERSION" \
              --prerelease \
              --target main
          fi
