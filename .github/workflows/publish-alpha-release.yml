name: Publish FRS alpha prerelease

# The first committed version of this workflow intentionally triggers the alpha release.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-alpha-release.yml

permissions:
  contents: write

concurrency:
  group: frs-alpha-release-v0.1.0-alpha.1
  cancel-in-progress: false

jobs:
  backend-quality:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Lint Python
        run: ruff check app tests
      - name: Run backend tests
        run: pytest -q

  android-debug-build:
    name: Flutter quality gate and Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --fatal-infos
      - name: Run Flutter tests
        run: flutter test --reporter expanded
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload APK for release
        uses: actions/upload-artifact@v7
        with:
          name: frs-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: [backend-quality, android-debug-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
      - name: Download tested Android APK
        uses: actions/download-artifact@v7
        with:
          name: frs-android-debug
          path: artifacts
      - name: Update repository About metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo edit nothingonly/Frs \
            --description "Face Recognition Attendance System (FRS) — Flutter Android kiosk and FastAPI backend for secure, multi-frame biometric attendance verification and identification." \
            --add-topic face-recognition \
            --add-topic attendance-system \
            --add-topic flutter \
            --add-topic fastapi \
            --add-topic python \
            --add-topic computer-vision \
            --add-topic arcface \
            --add-topic biometrics \
            --add-topic android-kiosk \
            --add-topic onnx

      - name: Create alpha prerelease if not already published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v0.1.0-alpha.1
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving the published release unchanged."
            exit 0
          fi
          gh release create "$VERSION" artifacts/app-debug.apk \
            --title "FRS v0.1.0 Alpha 1" \
            --notes-file releases/v0.1.0-alpha.1.md \
            --prerelease \
            --target "$GITHUB_SHA"
