name: FRS admin web checks

on:
  push:
    branches: [main, "implementation/**", "sprint/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check admin web
        run: pnpm typecheck
      - name: Lint admin web
        run: pnpm lint
      - name: Build admin web
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
