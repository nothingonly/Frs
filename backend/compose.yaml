services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frs}
      POSTGRES_USER: ${POSTGRES_USER:-frs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create backend/.env from .env.example and set POSTGRES_PASSWORD}
    volumes:
      - frs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frs} -d ${POSTGRES_DB:-frs}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [frs-internal]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file: .env
    environment:
      FRS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frs}
    command: ["python", "-m", "app.db.migrator", "--apply"]
    depends_on:
      db:
        condition: service_healthy
    networks: [frs-internal]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FRS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frs}
      FRS_MODEL_ROOT: /models/insightface
      FRS_WORKER_IN_PROCESS: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./model-artifacts:/models:ro
    ports:
      - "${FRS_BIND_ADDRESS:-127.0.0.1}:${FRS_BIND_PORT:-8000}:8000"
    networks: [frs-internal]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      FRS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frs}
      FRS_MODEL_ROOT: /models/insightface
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./model-artifacts:/models:ro
    networks: [frs-internal]

  followup-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.services.followup_worker", "--interval-seconds", "300"]
    restart: unless-stopped
    env_file: .env
    environment:
      FRS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-frs}
      FRS_MODEL_ROOT: /models/insightface
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [frs-internal]

volumes:
  frs-postgres:

networks:
  frs-internal:
    driver: bridge
