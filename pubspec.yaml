name: kiosk_app
description: "FRS Android biometric attendance kiosk with secure multi-frame 1:1 verification and 1:N identification"
publish_to: "none"
version: 0.1.0-dev.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  http: ^1.2.0
  intl: ^0.19.0
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
